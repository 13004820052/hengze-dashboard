<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>专业数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

        :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--green:#059669;--purple:#7c3aed}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,'Microsoft YaHei',sans-serif}
        .kpi{background:var(--card);border-left:4px solid var(--blue);border-radius:0 12px 12px 0;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
        .kpi.g{border-left-color:var(--green)}.kpi.p{border-left-color:var(--purple)}
        .kpi .v{font-size:26px;font-weight:700}.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
        canvas{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
        select,button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:13px}
        h1{font-size:20px;font-weight:700;letter-spacing:-0.5px}
        
.top{max-width:1100px;margin:0 auto;padding:20px}
h1{padding:10px 0}
.ctls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.grid1{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
@media(max-width:768px){.grid2,.grid1{grid-template-columns:1fr};.grid2{grid-template-columns:repeat(3,1fr)}}
</style></head><body>

<select id="rangeSel" onchange="updateAll()">

</select>
</div>

</div>

<div><canvas id="roiChart"></canvas></div>
</div>
</div>

function getData(store){
  var d=document.getElementById('rangeSel').value;
  var n=parseInt(d)||SS.length;
  var ser=SS.slice(-n);
  var labels=[],rev=[],net=[],spend=[],output=[],roiVals=[],rate=[];
  for(var i=0;i<ser.length;i++){
    var s=ser[i],dd=CD[s];
    if(!dd||!dd[store])continue;
    labels.push(dd.date);
    rev.push(dd[store][1]);
    spend.push(dd[store][0]);
    output.push(dd[store][2]);
    net.push(dd[store][5]);
    roiVals.push(dd[store][4]);
    rate.push(dd[store][6]);
  }
  return {labels:labels,rev:rev,net:net,spend:spend,output:output,roi:roiVals,rate:rate};
}
